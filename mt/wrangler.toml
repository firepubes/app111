name = "mailtune"
main = "src/index.ts"
compatibility_date = "2025-06-01"

workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "mailtune-db"
database_id = "YOUR_DATABASE_ID_HERE"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "ratiomail-attachments"

[[routes]]
pattern = "mail.example.com"
custom_domain = true

[vars]
APP_NAME = "Ratiomail"
MAIL_DOMAIN = "example.com, another-domain.com"
WEB_HOST = "mail.example.com"
EXPIRY_DAYS = "1"

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./src/web"

[observability]
enabled = true
