name = "ratiomail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "mailtune-db"
database_id = "YOUR_DATABASE_ID_HERE"

[[routes]]
pattern = "mail.ratiodevelopment.xyz"
custom_domain = true

[vars]
APP_NAME = "RatioMail"
MAIL_DOMAIN = "temp.ratiodevelopment.xyz"
WEB_HOST = "mail.ratiodevelopment.xyz"
EXPIRY_DAYS = "1"

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./src/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
